<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifePulse - Finance & Habit Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0b0f19',
            cardbg: '#111827'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkbg dark:text-gray-100 min-h-screen pb-20 font-sans antialiased transition-colors duration-300">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between transition-colors">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-chart-line text-indigo-600 dark:text-indigo-500 text-lg"></i>
      <span class="font-bold text-lg tracking-wide text-slate-900 dark:text-white">LifePulse</span>
    </div>
    
    <div class="flex items-center space-x-3 text-xs">
      <button onclick="toggleLanguage()" class="px-2 py-1 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-gray-300 font-medium">
        TH / EN
      </button>
      <button onclick="toggleTheme()" class="text-slate-600 dark:text-gray-400 hover:text-slate-900 dark:hover:text-white p-1">
        <i id="themeIcon" class="fa-solid fa-sun"></i>
      </button>
      <button onclick="handleAuth()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium flex items-center space-x-1 shadow-sm">
        <i class="fa-solid fa-user text-[10px]"></i>
        <span id="authBtnText">เข้าสู่ระบบ</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- USER LEVEL STATUS CARD -->
    <div class="bg-gradient-to-r from-purple-100 to-indigo-100 dark:from-purple-900/60 dark:to-indigo-900/60 border border-purple-200 dark:border-purple-500/30 rounded-2xl p-4 shadow-sm dark:shadow-lg">
      <div class="flex justify-between items-center mb-2">
        <div>
          <span id="userLevel" class="text-[10px] font-bold bg-purple-200 dark:bg-purple-500/30 text-purple-700 dark:text-purple-300 px-2 py-0.5 rounded-full uppercase tracking-wider">LVL 1</span>
          <h2 class="text-base font-bold text-slate-900 dark:text-white mt-1">Habit Master</h2>
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-500 dark:text-gray-400">Streak ติดต่อกัน</span>
          <p id="streakCounter" class="text-lg font-black text-amber-500 dark:text-amber-400">0 🔥</p>
        </div>
      </div>
      <div class="w-full bg-slate-200 dark:bg-slate-950/60 rounded-full h-2 overflow-hidden border border-purple-300 dark:border-purple-500/20">
        <div id="xpProgressBar" class="bg-gradient-to-r from-purple-500 to-indigo-500 h-full w-0 transition-all duration-500"></div>
      </div>
      <div class="flex justify-between text-[10px] text-slate-500 dark:text-gray-400 mt-1">
        <span>XP: <span id="userXP">0</span></span>
        <span>ถัดไป: <span id="nextLevelXP">100</span> XP</span>
      </div>
    </div>

    <!-- TAB 1: FINANCE (การเงิน) -->
    <section id="tab-finance" class="tab-content space-y-4">
      <div class="bg-white dark:bg-cardbg border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-xs text-slate-500 dark:text-gray-400" data-i18n="monthlyBudget">งบประมาณรายเดือน</span>
          <button onclick="setBudgetPrompt()" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline" data-i18n="edit">แก้ไข</button>
        </div>
        <div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-3 overflow-hidden">
          <div id="budgetProgressBar" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-xs text-slate-500 dark:text-gray-400">
          <span id="budgetSpentText">ใช้ไป: ฿0</span>
          <span id="budgetLimitText">งบ: ฿15,000</span>
        </div>
        
        <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 dark:border-slate-800/80 text-center">
          <div>
            <p class="text-[10px] text-slate-500 dark:text-gray-400" data-i18n="income">รายรับ</p>
            <p id="totalIncome" class="text-sm font-bold text-emerald-600 dark:text-emerald-400">฿0</p>
          </div>
          <div>
            <p class="text-[10px] text-slate-500 dark:text-gray-400" data-i18n="expense">รายจ่าย</p>
            <p id="totalExpense" class="text-sm font-bold text-rose-600 dark:text-rose-400">฿0</p>
          </div>
          <div>
            <p class="text-[10px] text-slate-500 dark:text-gray-400" data-i18n="balance">คงเหลือ</p>
            <p id="netBalance" class="text-sm font-bold text-indigo-600 dark:text-indigo-400">฿0</p>
          </div>
        </div>
      </div>

      <!-- ADD TRANSACTION FORM -->
      <form id="financeForm" onsubmit="addTransaction(event)" class="bg-white dark:bg-cardbg border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
        <h3 class="text-xs font-bold text-slate-700 dark:text-gray-300 uppercase tracking-wider" data-i18n="addTransaction">เพิ่มรายการ</h3>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="txTitle" placeholder="ชื่อรายการ" required class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs rounded-lg p-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500" />
          <input type="number" id="txAmount" placeholder="จำนวนเงิน" required class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs rounded-lg p-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <select id="txType" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs rounded-lg p-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
            <option value="expense" data-i18n="expense">รายจ่าย</option>
            <option value="income" data-i18n="income">รายรับ</option>
          </select>
          <select id="txCategory" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs rounded-lg p-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
            <option value="food" data-i18n="food">อาหาร</option>
            <option value="transport" data-i18n="transport">เดินทาง</option>
            <option value="shopping" data-i18n="shopping">ช้อปปิ้ง</option>
            <option value="bills" data-i18n="bills">บิล/ที่พัก</option>
            <option value="other" data-i18n="other">อื่นๆ</option>
          </select>
        </div>
        <label class="flex items-center space-x-2 text-xs text-slate-600 dark:text-gray-400 cursor-pointer">
          <input type="checkbox" id="txRecurring" class="rounded bg-slate-50 dark:bg-slate-900 border-slate-300 dark:border-slate-700 text-indigo-600 focus:ring-0" />
          <span data-i18n="recurringItem">รายการประจำทุกเดือน (Recurring)</span>
        </label>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg text-xs shadow-md" data-i18n="add">
          บันทึกข้อมูล
        </button>
      </form>

      <!-- CHART -->
      <div class="bg-white dark:bg-cardbg border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
        <h3 class="text-xs font-bold text-slate-700 dark:text-gray-300 uppercase tracking-wider mb-3" data-i18n="chartTitle">สัดส่วนรายจ่าย</h3>
        <canvas id="financeChart" class="max-h-48"></canvas>
      </div>

      <!-- HISTORY -->
      <div class="bg-white dark:bg-cardbg border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
        <h3 class="text-xs font-bold text-slate-700 dark:text-gray-300 uppercase tracking-wider mb-2" data-i18n="history">ประวัติรายการ</h3>
        <ul id="txList" class="divide-y divide-slate-100 dark:divide-slate-800 text-xs"></ul>
      </div>
    </section>

    <!-- TAB 2: HABITS (วินัยประจำวัน) -->
    <section id="tab-habits" class="tab-content hidden space-y-4">
      <form id="habitForm" onsubmit="addHabit(event)" class="bg-white dark:bg-cardbg border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm flex gap-2">
        <input type="text" id="habitName" placeholder="เพิ่มนิสัยใหม่ เช่น อ่านหนังสือ 20 นาที" required class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs rounded-lg p-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-purple-500" />
        <button type="submit" class="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-medium rounded-lg text-xs">เพิ่ม</button>
      </form>

      <div class="bg-white dark:bg-cardbg border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
        <h3 class="text-xs font-bold text-slate-700 dark:text-gray-300 uppercase tracking-wider" data-i18n="todayHabits">นิสัยประจำวันนี้</h3>
        <div id="habitList" class="space-y-2"></div>
      </div>
    </section>

    <!-- TAB 3: CALENDAR (ปฏิทิน) -->
    <section id="tab-calendar" class="tab-content hidden space-y-4">
      <div class="bg-white dark:bg-cardbg border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <button onclick="changeMonth(-1)" class="p-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-gray-300 rounded-lg text-xs">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <h3 id="calendarMonthYear" class="text-sm font-bold text-purple-700 dark:text-purple-300">เดือน ปี</h3>
          <button onclick="changeMonth(1)" class="p-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-gray-300 rounded-lg text-xs">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center font-bold text-[10px] text-slate-500 dark:text-gray-400 mb-2">
          <div class="text-rose-500">อา</div>
          <div>จ</div>
          <div>อ</div>
          <div>พ</div>
          <div>พฤ</div>
          <div>ศ</div>
          <div class="text-sky-500">ส</div>
        </div>

        <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center"></div>
      </div>

      <div id="dayDetailPanel" class="hidden bg-white dark:bg-cardbg border border-purple-300 dark:border-purple-500/40 rounded-2xl p-4 shadow-lg space-y-2">
        <h4 id="selectedDateTitle" class="text-xs font-bold text-purple-700 dark:text-purple-300 border-b border-slate-200 dark:border-slate-800 pb-2"></h4>
        <div id="selectedDateContent" class="text-xs space-y-1"></div>
      </div>
    </section>

    <!-- TAB 4: STATS (สถิติ) -->
    <section id="tab-stats" class="tab-content hidden space-y-4">
      <div class="bg-white dark:bg-cardbg border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
        <h3 class="text-xs font-bold text-slate-700 dark:text-gray-300 uppercase tracking-wider" data-i18n="monthlyStats">สถิตินิสัยรายเดือน</h3>
        <div id="habitStatsList" class="space-y-3"></div>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 py-2 px-4 z-50 transition-colors">
    <div class="max-w-md mx-auto grid grid-cols-4 text-center">
      <button id="nav-finance" onclick="switchTab('finance')" class="flex flex-col items-center text-indigo-600 dark:text-indigo-400">
        <i class="fa-solid fa-wallet text-base"></i>
        <span class="text-[10px] mt-1 font-medium" data-i18n="tabFinance">การเงิน</span>
      </button>
      <button id="nav-habits" onclick="switchTab('habits')" class="flex flex-col items-center text-slate-400 dark:text-gray-400">
        <i class="fa-solid fa-circle-check text-base"></i>
        <span class="text-[10px] mt-1 font-medium" data-i18n="tabHabits">วินัยประจำวัน</span>
      </button>
      <button id="nav-calendar" onclick="switchTab('calendar')" class="flex flex-col items-center text-slate-400 dark:text-gray-400">
        <i class="fa-solid fa-calendar-days text-base"></i>
        <span class="text-[10px] mt-1 font-medium" data-i18n="tabCalendar">ปฏิทิน</span>
      </button>
      <button id="nav-stats" onclick="switchTab('stats')" class="flex flex-col items-center text-slate-400 dark:text-gray-400">
        <i class="fa-solid fa-chart-pie text-base"></i>
        <span class="text-[10px] mt-1 font-medium" data-i18n="tabStats">สถิติ</span>
      </button>
    </div>
  </nav>

  <script src="app.js"></script>
</body>
</html>
